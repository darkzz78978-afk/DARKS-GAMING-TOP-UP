<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030508">
<title>DARK | Gaming Store</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#030406;
color:#fff;
overflow-x:hidden;
}

body:before{
content:"";
position:fixed;
inset:0;
z-index:-5;
background:
linear-gradient(180deg,rgba(0,0,0,.45),#030406 85%),
url("1787436314905.png") center/cover no-repeat;
}

body:after{
content:"";
position:fixed;
inset:0;
z-index:-4;
background:
radial-gradient(circle at 20% 20%,rgba(0,145,255,.22),transparent 28%),
radial-gradient(circle at 80% 40%,rgba(0,255,140,.10),transparent 25%);
pointer-events:none;
}

a{
text-decoration:none;
color:inherit;
}

button,
input{
font:inherit;
}

/* ================= HEADER ================= */

header{
position:fixed;
top:0;
left:0;
right:0;
z-index:1000;
background:rgba(0,0,0,.68);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(0,170,255,.18);
}

.nav{
width:min(1200px,92%);
height:78px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo-img{
width:125px;
height:60px;
object-fit:contain;
filter:drop-shadow(0 0 12px #008cff);
}

nav{
display:flex;
gap:28px;
}

nav a{
font-size:12px;
font-weight:900;
letter-spacing:1px;
color:#b4becb;
transition:.25s;
}

nav a:hover{
color:#00b7ff;
text-shadow:0 0 15px #008cff;
}

.menu{
display:none;
background:none;
border:1px solid #123;
color:#fff;
padding:10px;
border-radius:10px;
cursor:pointer;
}

/* ================= HERO ================= */

.hero{
min-height:100vh;
padding-top:78px;
display:flex;
align-items:center;
}

.hero-inner{
width:min(1200px,92%);
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
align-items:center;
}

.tag{
color:#00b7ff;
font-size:11px;
font-weight:900;
letter-spacing:3px;
margin-bottom:15px;
}

.hero h1{
font-size:clamp(55px,8vw,105px);
line-height:.85;
letter-spacing:-6px;
}

.hero h1 span{
color:#00aaff;
text-shadow:
0 0 15px #008cff,
0 0 50px rgba(0,140,255,.7);
}

.hero p{
max-width:560px;
margin:28px 0;
color:#a0adbb;
line-height:1.7;
font-size:16px;
}

.actions{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.btn{
border:0;
border-radius:12px;
padding:15px 22px;
font-weight:900;
cursor:pointer;
transition:.25s;
}

.primary{
background:linear-gradient(135deg,#00aaff,#00e5ff);
color:#001018;
box-shadow:0 0 30px rgba(0,170,255,.3);
}

.primary:hover{
transform:translateY(-3px);
box-shadow:0 0 50px rgba(0,170,255,.6);
}

.secondary{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.15);
color:#fff;
}

.secondary:hover{
border-color:#00aaff;
color:#00b7ff;
}

display:block;
margin:auto;
