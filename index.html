<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>4D Hypercube (Tesseract) Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050505; font-family: sans-serif; color: white; }
    #ui {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.8); padding: 12px 20px;
      border-radius: 8px; border: 1px solid #333;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">
    <h2>4D Tesseract Projection</h2>
    <p>Simulating 16 vertices connected across 4 dimensions (X, Y, Z, W).</p>
  </div>

  <script>
    // 1. Scene & Camera Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. Generate 16 Vertices of a 4D Hypercube (±1, ±1, ±1, ±1)
    const vertices4D = [];
    for (let i = 0; i < 16; i++) {
      vertices4D.push([
        (i & 1) ? 1 : -1,
        (i & 2) ? 1 : -1,
        (i & 4) ? 1 : -1,
        (i & 8) ? 1 : -1
      ]);
    }

    // 3. Define 32 Edges (Connections where points differ by only 1 dimension)
    const edges = [];
    for (let i = 0; i < 16; i++) {
      for (let j = i + 1; j < 16; j++) {
        let diff = 0;
        for (let k = 0; k < 4; k++) {
          if (vertices4D[i][k] !== vertices4D[j][k]) diff++;
        }
        if (diff === 1) edges.push([i, j]);
      }
    }

    // 4. Create Graphical Objects in 3D
    const nodeGeometry = new THREE.SphereGeometry(0.08, 16, 16);
    const nodeMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const nodes = [];

    for (let i = 0; i < 16; i++) {
      const node = new THREE.Mesh(nodeGeometry, nodeMaterial);
      scene.add(node);
      nodes.push(node);
    }

    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xff007f, linewidth: 2 });
    const lineGeometries = [];
    
    edges.forEach(() => {
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0, 0, 0], 3));
      const line = new THREE.Line(geom, lineMaterial);
      scene.add(line);
      lineGeometries.push(geom);
    });

    // 5. 4D Rotation Logic (XW Plane & ZW Plane Rotation)
    let angle = 0;

    function project4Dto3D(v4) {
      let x = v4[0], y = v4[1], z = v4[2], w = v4[3];

      // Rotate in 4D space (XW and ZW planes)
      let cosA = Math.cos(angle), sinA = Math.sin(angle);

      // X-W rotation
      let x1 = x * cosA - w * sinA;
      let w1 = x * sinA + w * cosA;

      // Z-W rotation
      let z1 = z * cosA - w1 * sinA;
      let w2 = z * sinA + w1 * cosA;

      // Perspective Projection from 4D to 3D
      const distance = 3; // 4D camera distance
      const wScale = 1 / (distance - w2);

      return new THREE.Vector3(x1 * wScale * 2, y * wScale * 2, z1 * wScale * 2);
    }

    // 6. Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      angle += 0.015; // Speed of 4D rotation

      const projected3D = vertices4D.map(v => project4Dto3D(v));

      // Update Node Positions
      for (let i = 0; i < 16; i++) {
        nodes[i].position.copy(projected3D[i]);
      }

      // Update Edge Lines
      edges.forEach((edge, index) => {
        const p1 = projected3D[edge[0]];
        const p2 = projected3D[edge[1]];
        const positions = new Float32Array([p1.x, p1.y, p1.z, p2.x, p2.y, p2.z]);
        
        lineGeometries[index].setAttribute('position', new THREE.BufferAttribute(positions, 3));
        lineGeometries[index].attributes.position.needsUpdate = true;
      });

      // Slowly rotate the entire scene in 3D for viewing perspective
      scene.rotation.y += 0.005;
      scene.rotation.x += 0.003;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
