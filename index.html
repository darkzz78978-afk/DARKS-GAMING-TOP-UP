<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realistic House Building Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 8px;
    }
    select, button { margin-top: 5px; padding: 8px; border-radius: 4px; }
  </style>

  <!-- Import Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui">
    <h3>House Builder 3D</h3>
    <label for="materialSelect">Select Material:</label><br>
    <select id="materialSelect">
      <option value="brick">Red Brick</option>
      <option value="concrete">Polished Concrete</option>
      <option value="wood">Dark Wood</option>
      <option value="glass">Reinforced Glass</option>
    </select>
    <p><strong>Controls:</strong><br>
    • Click on floor: Place Block<br>
    • Right-Click + Drag: Rotate Camera<br>
    • Scroll: Zoom</p>
  </div>

  <script>
    // 1. Scene, Camera, and Renderer Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Sky blue
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 15, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);

    // 2. Realistic Lighting (Sunlight & Ambient Sky)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.5);
    sunLight.position.set(20, 40, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 100;
    sunLight.shadow.camera.left = -25;
    sunLight.shadow.camera.right = 25;
    sunLight.shadow.camera.top = 25;
    sunLight.shadow.camera.bottom = -25;
    scene.add(sunLight);

    // 3. Define Real House Materials (Physically Based Rendering)
    const materials = {
      brick: new THREE.MeshStandardMaterial({
        color: 0xa52a2a,
        roughness: 0.9,
        metalness: 0.1
      }),
      concrete: new THREE.MeshStandardMaterial({
        color: 0x808080,
        roughness: 0.4,
        metalness: 0.1
      }),
      wood: new THREE.MeshStandardMaterial({
        color: 0x5c4033,
        roughness: 0.6,
        metalness: 0.0
      }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.3,
        roughness: 0.1,
        transmission: 0.9,
        thickness: 0.5
      })
    };

    // 4. Ground Foundation
    const gridGeometry = new THREE.BoxGeometry(30, 0.2, 30);
    const gridMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
    const ground = new THREE.Mesh(gridGeometry, gridMaterial);
    ground.position.y = -0.1;
    ground.receiveShadow = true;
    scene.add(ground);

    const gridHelper = new THREE.GridHelper(30, 30, 0x000000, 0x444444);
    scene.add(gridHelper);

    // 5. Interactive Building Logic
    const objects = [ground];
    const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (event) => {
      // Ignore clicks on UI elements
      if (event.target.tagName === 'SELECT' || event.target.tagName === 'OPTION') return;

      // Only left click builds
      if (event.button !== 0) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(objects, false);

      if (intersects.length > 0) {
        const intersect = intersects[0];

        // Determine selected material
        const selectedMatKey = document.getElementById('materialSelect').value;
        const selectedMaterial = materials[selectedMatKey];

        // Create and position the block snapped to the grid
        const block = new THREE.Mesh(blockGeometry, selectedMaterial);
        block.castShadow = true;
        block.receiveShadow = true;

        block.position.copy(intersect.point).add(intersect.face.normal);
        block.position.floor().addScalar(0.5); // Snap to 1x1x1 grid

        scene.add(block);
        objects.push(block);
      }
    });

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 6. Game Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
